name: Update Shader Database

on:
  schedule:
    # Run daily at midnight UTC
    - cron: '0 0 * * *'
  workflow_dispatch: # Allow manual trigger

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  scrape:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
      
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          pip install requests beautifulsoup4
      
      - name: Scrape shaders
        run: python scripts/scrape_shaders.py

      - name: Guard against a broken scrape
        # If the scraper returns far fewer shaders than expected (e.g. 0 because
        # godotshaders.com changed its markup or started blocking us), do NOT
        # let the near-empty result overwrite the good database. The real DB is
        # ~2200 entries, so anything under this floor means the scrape failed.
        run: |
          COUNT=$(python -c "import json; print(json.load(open('data/shaders.json')).get('count', 0))")
          echo "Scraped shader count: $COUNT"
          if [ "$COUNT" -lt 1000 ]; then
            echo "::warning::Scrape returned only $COUNT shaders (< 1000). Keeping the existing database instead of committing a broken one."
            git checkout -- data/shaders.json
          fi

      - name: Commit and push if changed
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add data/shaders.json
          git diff --staged --quiet || git commit -m "Update shader database [$(date -u +%Y-%m-%d)]"
          git push
